{% extends 'base.html' %}{% block content %}<h1>交易记录</h1><table><tr><th>时间</th><th>类型</th><th>金额</th><th>说明</th></tr>{% for t in transactions %}<tr><td>{{t.created_at}}</td><td>{{t.kind}}</td><td>¥{{'%.2f'|format(t.amount / 100)}}</td><td>{{t.detail}}</td></tr>{% else %}<tr><td colspan="4">暂无交易</td></tr>{% endfor %}</table>{% endblock %}
