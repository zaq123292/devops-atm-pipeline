groups:
  - name: atm-alerts
    rules:
      - alert: High5xxRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "5xx 错误率超过 1%"
          description: "当前 5xx 比例 {{ $value | humanizePercentage }}，超过阈值 1%，请检查日志并考虑回滚"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(flask_http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels: {severity: warning}
        annotations:
          summary: "P95 响应时间超过 2 秒"
          description: "P95 延迟 {{ $value }}s，请排查应用/数据库负载"

      - alert: DatabaseDown
        expr: up{job="atm"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "ATM 服务不可达"
          description: "Prometheus 无法抓取 web:5000 指标，服务可能已宕机"

      - alert: DiskSpaceHigh
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 80
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "磁盘使用率超过 80%"
          description: "磁盘使用率 {{ $value }}%，请及时清理或扩容"
