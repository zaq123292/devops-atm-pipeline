services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: atm
      POSTGRES_USER: atm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm_user -d atm"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    # 支持通过 IMAGE_TAG 环境变量指定镜像版本，便于回滚
    image: devops-atm:${IMAGE_TAG:-latest}
    build: .
    ports: ["5000:5000"]
    environment:
      DATABASE_URL: postgresql://atm_user:${DB_PASSWORD}@db:5432/atm
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [web]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [web]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata: {}
  prometheus_data: {}
  grafana_data: {}
